name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: gofmt check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted by gofmt:"
            echo "$output"
            exit 1
          fi

      - name: go vet (root)
        run: go vet ./...

      - name: go vet (apps/oip)
        run: cd apps/oip && go vet ./...

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: golangci-lint (apps/oip)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: apps/oip

      - name: Build and Test
        run: make build test

  e1:
    name: AWIS-E1
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run e1
        run: make e1
