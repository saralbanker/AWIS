name: CI

# Minimum viable verification CI (stabilization sprint S6).
#
# Scope is deliberately narrow: Linux only, no matrix, no release pipeline, no
# deployment. Its single job is to answer "are the gates green?" and it does so
# by running the same `make` targets a developer runs locally, so a green check
# here and a green run on a laptop mean the same thing.
#
# Deliberately NOT wired yet (each is a known, tracked gap, not an oversight):
#   - macOS: the previous workflow declared a macOS matrix leg that never once
#     executed. A matrix is only worth adding after Linux is proven green.
#   - pytest, benchmarks, release-dry: out of scope for a verification-only CI.
#
# CGO_ENABLED is intentionally left at its default of 1. `go test -race`
# requires cgo; the previous workflow set CGO_ENABLED=0 globally, which means a
# race job could never have passed under it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is REQUIRED, not a default worth trimming.
      # actions/checkout defaults to a depth-1 clone, in which
      # `git rev-parse HEAD~1` fails and TestE2EGitDiffFetch_CapabilityIDHandler
      # silently t.Skip()s while the package still reports ok — a fake-green
      # path. Proven by running the suite in a `git clone --depth 1`.
      # (That test arrives with M12; wired here so the guard predates it.)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Report toolchain
        run: |
          go version
          golangci-lint version

      # Individual gates are run as named steps so a failure is legible in the
      # UI without opening logs. `make verify` runs the identical set and is
      # what developers run locally.
      - name: gofmt
        run: make gofmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      - name: apps/oip standalone module (GOWORK=off)
        run: make oip-isolation

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Race
        run: make race

      - name: Zero-AI gate (E1)
        run: make e1

  # Separate job because this guards the EEOS process rather than the code, and
  # it should not gate developer inner-loop feedback. It passes on main today
  # and acts as a merge guard: M15, M16 and M17 currently carry incomplete
  # module artifacts, so this job will correctly go red if they are merged
  # before those files are materialized. That is the intended behaviour.
  docs-lint:
    name: EEOS docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docs-lint
        run: bash scripts/docs-lint.sh
