name: Release

# Tag-triggered release (IMP §21 CD). A pushed v* tag builds the four static product
# binaries (linux and darwin, amd64 and arm64), checksums, and a GitHub release whose
# notes are the milestone PR titles selected by the changelog filter in .goreleaser.yaml.
#
# Nothing publishes unless the gates pass on the tagged commit: the same `make verify`
# target that the ci.yml verify job runs (ubuntu leg) runs here first, with the same
# pins, and goreleaser runs only after it is green. ci.yml is deliberately not modified.
#
# Triggers only on v* tags. Branch pushes and pull requests never run this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 is REQUIRED, not a default worth trimming: goreleaser builds the
      # changelog from the commit range since the previous v* tag, and `make test` includes
      # a git-history test that a depth-1 clone would silently skip (see ci.yml).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # Same golangci-lint pin as ci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # Gate before publish: the identical single target that ci.yml and developers run.
      - name: Verify gates (make verify)
        run: make verify

      # Same goreleaser pin as the Makefile (GORELEASER_VERSION := v2.17.0). The token is
      # given to this step only; nothing before it can read it.
      - name: Release (goreleaser v2.17.0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run github.com/goreleaser/goreleaser/v2@v2.17.0 release --clean
